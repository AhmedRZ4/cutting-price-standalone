<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cutting Price Calculator (Standalone)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Cutting Price Calculator (Standalone)</h1>
      <span class="muted">Estimator Only</span>
    </div>

    <div class="grid">
      <div class="card">
        <h2 style="font-size:16px;margin:0 0 8px 0;">General Inputs</h2>
        <div class="grid">
          <label class="row"><span class="label">Targeted profit</span>
            <span>
              <input id="targetedProfit" type="number" step="0.01" value="0.5" />
              <span class="muted">(0…1)</span>
            </span>
          </label>
          <label class="row"><span class="label">Cost of operator + helper</span>
            <span><input id="costOpHelper" type="number" value="330" /><span class="muted"> AED</span></span>
          </label>
          <label class="row"><span class="label">Unifex + depreciation / m</span>
            <span><input id="unifexPerM" type="number" value="35" /><span class="muted"> AED/m</span></span>
          </label>
        </div>
      </div>

      <div class="card">
        <h2 style="font-size:16px;margin:0 0 8px 0;">Cutting Price Estimating</h2>
        <div class="grid">
          <label class="row"><span class="label">Type</span>
            <select id="typeChoice">
              <option>Slab</option>
              <option selected>Shearwall</option>
            </select>
          </label>
          <label class="row"><span class="label">Cutting meters</span>
            <span><input id="cuttingMeters" type="number" step="0.01" value="8.85" /><span class="muted"> m</span></span>
          </label>
          <label class="row"><span class="label">Number of cuts</span>
            <input id="numCuts" type="number" value="4" />
          </label>
          <label class="row"><span class="label">Coring</span>
            <span><input id="coringPrice" type="number" value="55" /><span class="muted"> AED/piece</span></span>
          </label>
          <label class="row"><span class="label">Lifting & shifting / piece</span>
            <span><input id="liftShiftPrice" type="number" value="20" /><span class="muted"> AED/piece</span></span>
          </label>
        </div>
        <div class="divider">
          <div class="stat"><span class="muted">Total price</span><span id="totalPrice" class="value">0.00 AED</span></div>
          <div class="stat"><span class="muted">Price per meter</span><span id="pricePerM" class="value">0.00 AED</span></div>
          <div class="small muted">Blade: 800 mm (fixed)</div>
        </div>
      </div>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
